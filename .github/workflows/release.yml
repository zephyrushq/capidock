name: Android release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# A queued run checks out the newest release tip and includes all pending commits.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release
          fetch-depth: 0

      - run: python3 tool/security_checks.py
      - name: Test release versioning
        run: python3 -m unittest discover -s tool/tests -v

      - name: Calculate version and release notes
        id: version
        run: python3 tool/release_version.py --notes "$RUNNER_TEMP/release-notes.md"

      - name: Skip an already published release
        id: publication
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-error.log"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/existing-release.json" > /dev/null; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "### $TAG is already published" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          elif ! grep -qi 'release not found\|not found\|HTTP 404' "$RUNNER_TEMP/release-error.log"; then
            cat "$RUNNER_TEMP/release-error.log" >&2
            exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        if: steps.publication.outputs.needed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing $secret. Follow docs/releases.md to configure Android signing."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/capidock-release.jks"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.publication.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.publication.outputs.needed == 'true'
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Verify Flutter app
        if: steps.publication.outputs.needed == 'true'
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Verify real SSH transport
        if: steps.publication.outputs.needed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/ssh-tests"
          "$RUNNER_TEMP/ssh-tests/bin/pip" install -r tool/testing/requirements.txt
          CAPIDOCK_TEST_PYTHON="$RUNNER_TEMP/ssh-tests/bin/python" bash tool/testing/run_ssh_smoke.sh

      - name: Build signed APK and package source and notices
        if: steps.publication.outputs.needed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          CAPIDOCK_KEYSTORE_PATH: ${{ runner.temp }}/capidock-release.jks
          CAPIDOCK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAPIDOCK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAPIDOCK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --obfuscate --split-debug-info="$RUNNER_TEMP/capidock-symbols" --build-name "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/capidock-$RELEASE_VERSION.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "dist/capidock-$RELEASE_VERSION.apk"
          git archive --format=tar.gz --prefix="capidock-$RELEASE_VERSION/" --output="dist/capidock-$RELEASE_VERSION-source.tar.gz" "$RELEASE_SHA"
          cp LICENSE LICENSE-TRADEMARKS COPYRIGHT dist/
          cd dist
          sha256sum "capidock-$RELEASE_VERSION.apk" "capidock-$RELEASE_VERSION-source.tar.gz" LICENSE LICENSE-TRADEMARKS COPYRIGHT > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.publication.outputs.needed == 'true'
        with:
          name: capidock-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # Public repository Actions artifacts are not a confidential symbol store.
      - name: Encrypt debug symbols for optional retention
        if: steps.publication.outputs.needed == 'true'
        env:
          SYMBOLS_PASSWORD: ${{ secrets.CAPIDOCK_SYMBOLS_PASSWORD }}
        run: |
          if [ -n "$SYMBOLS_PASSWORD" ]; then
            tar -czf "$RUNNER_TEMP/capidock-symbols.tar.gz" -C "$RUNNER_TEMP/capidock-symbols" .
            printf '%s' "$SYMBOLS_PASSWORD" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/capidock-symbols.tar.gz.gpg" "$RUNNER_TEMP/capidock-symbols.tar.gz"
            rm -f "$RUNNER_TEMP/capidock-symbols.tar.gz"
          else
            echo "Debug symbols will not be retained. Configure CAPIDOCK_SYMBOLS_PASSWORD for encrypted retention." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.publication.outputs.needed == 'true'
        with:
          name: capidock-symbols-encrypted-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/capidock-symbols.tar.gz.gpg
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish tag and GitHub Release
        if: steps.publication.outputs.needed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          if [ "$TAG_EXISTS" != true ]; then
            git -c tag.gpgSign=false tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Capidock $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
          echo "### Published Capidock $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/capidock-release.jks"
