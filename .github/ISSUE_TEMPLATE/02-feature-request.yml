name: Feature request
description: Suggest an improvement and explain the problem it would solve.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Write in English and focus on one proposal. Capidock currently prioritizes
        a local Android app with workspaces and instances. Proposals are welcome;
        submitting one does not mean it has been scheduled for implementation.
  - type: checkboxes
    id: existing-requests
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected user experience. Mention new permissions, credentials, or network services if your proposal needs them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any existing workaround or simpler solution.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples, sketches, or related issues. Use fictional server data.
